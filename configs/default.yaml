# ─────────────────────────────────────────────────────────────
# configs/default.yaml
# All project hyperparameters in one place.
# Override individual values without touching source code.
# ─────────────────────────────────────────────────────────────

paths:
  data_dir:        data/CICIDS2017          # raw CSV files
  prep_dir:        outputs/preprocessing   # X_train.npy, X_test.npy, y_test.npy
  models_dir:      models
  outputs_dir:     outputs/models
  results_dir:     results
  logs_dir:        logs

seed: 42

# ─────────────────────────────────────────────────────────────
# Feature engineering
# ─────────────────────────────────────────────────────────────
features:
  iqr_lower:         0.01
  iqr_upper:         0.99
  skew_threshold:    1.0
  corr_threshold:    0.95

# ─────────────────────────────────────────────────────────────
# Phase 1 — Model A : Gaussian Mixture Model
# ─────────────────────────────────────────────────────────────
gmm:
  n_components:          12
  covariance_type:       full
  threshold_percentile:  11
  n_init:                3
  max_iter:              200
  tune_subsample:        80000

# ─────────────────────────────────────────────────────────────
# Phase 1 — Baseline models (Isolation Forest, OCSVM)
# ─────────────────────────────────────────────────────────────
isolation_forest:
  n_estimators:    50
  contamination:   0.15
  max_features:    0.5

ocsvm:
  nu:          0.2
  kernel:      rbf
  gamma:       0.1
  train_cap:   8000

# ─────────────────────────────────────────────────────────────
# Phase 2 — Sequence anomaly detection
# ─────────────────────────────────────────────────────────────
phase2:
  model:         lstm_ae     # 'lstm_ae' | 'transformer_ae' | 'usad'
  train_stride:  5           # step between training window starts
  eval_stride:   1           # stride when scoring flows (1 = full coverage)
  max_windows:   null        # cap training windows (null = all)

# ─────────────────────────────────────────────────────────────
# Phase 2 — Model B : LSTM Autoencoder
# ─────────────────────────────────────────────────────────────
lstm_ae:
  window_size:      50
  latent_dim:       32
  dropout_rate:     0.2
  lr:               0.001
  epochs:           100
  batch_size:       256
  patience:         10
  val_split:        0.1          # fraction of train windows held for validation
  threshold_pct:    95           # percentile of benign val scores → decision threshold

# ─────────────────────────────────────────────────────────────
# Phase 2 — Alternative: Transformer Autoencoder
# ─────────────────────────────────────────────────────────────
transformer_ae:
  window_size:      50
  d_model:          64
  num_heads:        4
  latent_dim:       32
  dropout_rate:     0.1
  lr:               0.001
  epochs:           100
  batch_size:       256
  patience:         10
  val_split:        0.1
  threshold_pct:    95

# ─────────────────────────────────────────────────────────────
# Phase 2 — Alternative: USAD (adversarial AE)
# ─────────────────────────────────────────────────────────────
usad:
  window_size:      50
  hidden_dim:       64
  latent_dim:       32
  alpha:            0.5
  lr:               0.001
  epochs:           50
  batch_size:       256
  threshold_pct:    95

# ─────────────────────────────────────────────────────────────
# Flow-level deep baseline: Deep SVDD
# ─────────────────────────────────────────────────────────────
deep_svdd:
  hidden_dim:       64
  latent_dim:       8
  lr:               0.001
  epochs:           100
  batch_size:       512
  patience:         10
  threshold_pct:    95

# ─────────────────────────────────────────────────────────────
# Phase 3 — Model C : calibrated fusion (leak-free)
# ─────────────────────────────────────────────────────────────
hybrid:
  alpha:              0.7        # GMM weight in the weighted-average fallback
  threshold:          0.5
  meta_train_frac:    0.4        # fraction of labeled pool used to FIT calibrators +
                                 # meta-learner; metrics reported on the rest only
  candidates:         [rf, lr, weighted]   # compared by CV PR-AUC inside meta-fit
  cv_folds:           3

# ─────────────────────────────────────────────────────────────
# Evaluation
# ─────────────────────────────────────────────────────────────
evaluation:
  roc_plot:         true
  cm_plot:          true
  score_dist_plot:  true
  per_attack_csv:   true
  report_txt:       true

# ─────────────────────────────────────────────────────────────
# Detection (inference mode)
# ─────────────────────────────────────────────────────────────
detect:
  model:            hybrid      # 'gmm' | 'lstm_ae' | 'hybrid'
  batch_size:       1024
  output_scores:    true        # include raw anomaly scores in output CSV
